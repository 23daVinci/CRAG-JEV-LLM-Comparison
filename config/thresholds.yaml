# Jev returns probabilities; Gemini returns a hard yes/no. These thresholds are what convert
# Jev's probabilities into the same booleans the graph consumes from either backend — they live
# here, versioned, rather than inline in code, because the methodology requires them frozen before
# the held-out test split and the sweep published, not tuned after seeing results.
#
# Starting values are the vendor's own cookbook defaults (docs.typesafe.ai/cookbooks/
# classifying_rag_passages), used untuned for the first reported run; see docs/METHODOLOGY.md.
relevance: 0.45
evidence: 0.55
injection: 0.70
contradiction: 0.70
sufficiency: 0.50
