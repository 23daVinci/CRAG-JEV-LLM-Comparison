[project]
name = "jev-bench"
version = "0.1.0"
description = "A/B benchmark of an agentic document-retrieval workflow: Gemini-graded decisions vs Jev-graded decisions, same graph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.6.1,<2",
    "langchain-google-genai>=4.4,<5",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "sse-starlette>=2.1,<3",
    "typer>=0.13,<1",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "typesafe-sdk>=0.1,<1",
    "pyyaml>=6.0,<7",
    "langchain-ollama>=1.1.0",
    "langchain-groq>=1.1.3",
]

[project.scripts]
jev-bench = "jev_bench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
    "types-PyYAML>=6.0,<7",
    "scipy-stubs>=1.14,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits a real external API (Gemini/Jev) and requires an API key; excluded by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["jev_bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_bench"]
